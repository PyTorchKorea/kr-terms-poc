name: 새 용어 요청
description: 사전에 없는 AI/ML 용어의 추가를 요청합니다
title: "[새 용어] "
labels: ["새 용어 요청"]
body:
  - type: markdown
    attributes:
      value: |
        > 💡 권한이 있는 관리자가 `/approve` 댓글을 남기거나 `approved` 라벨을 붙이면 자동으로 반영되며, 기여자로 등록됩니다(Co-authored-by).
  - type: input
    id: term
    attributes:
      label: 영문 용어
      description: 추가를 요청하는 영문 용어를 입력하세요
      placeholder: "예: retrieval-augmented generation"
    validations:
      required: true
  - type: input
    id: korean
    attributes:
      label: 제안 한글 번역
      description: 적절한 한글 번역을 제안해주세요
      placeholder: "예: 검색 증강 생성"
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: 정의
      description: 용어에 대한 간결한 한국어 정의를 작성해주세요
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: 사용 예시 (선택)
      description: |
        영어 원문과 한국어 번역을 함께 작성해주세요. 출처가 있다면 URL도 포함해주세요.
        예시 형식:
        - EN: The Transformer model uses a self-attention mechanism.
        - KO: 트랜스포머 모델은 셀프 어텐션 메커니즘을 사용한다.
        - 출처: https://arxiv.org/abs/1706.03762
