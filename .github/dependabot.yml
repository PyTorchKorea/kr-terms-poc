version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      npm-security-and-patches:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    commit-message:
      prefix: chore
      include: scope
