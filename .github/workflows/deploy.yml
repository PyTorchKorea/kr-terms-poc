name: Deploy to GitHub Pages

on:
  push:
    branches: [poc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate term data
        run: |
          node -e "
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('data/index.json', 'utf-8'));
          let errors = 0;
          for (const file of index) {
            const terms = JSON.parse(fs.readFileSync('data/' + file, 'utf-8'));
            for (const term of terms) {
              if (!term.term || !Array.isArray(term.meanings) || term.meanings.length === 0) {
                console.error('Invalid term in ' + file + ':', term.term);
                errors++;
              }
              if (term.issueNumber !== undefined) {
                if (typeof term.issueNumber !== 'number' || !Number.isInteger(term.issueNumber) || term.issueNumber <= 0) {
                  console.error('Invalid issueNumber in ' + file + ' term: ' + term.term);
                  errors++;
                }
              }
              if (term.notes !== undefined && typeof term.notes !== 'string') {
                console.error('Invalid notes in ' + file + ' term: ' + term.term);
                errors++;
              }
              for (const m of term.meanings) {
                if (!m.korean || !m.definition) {
                  console.error('Missing fields in ' + file + ' term: ' + term.term);
                  errors++;
                }
                if (m.examples) {
                  for (const ex of m.examples) {
                    if (typeof ex === 'object' && (!ex.en || !ex.ko)) {
                      console.error('Example missing en/ko in ' + file + ' term: ' + term.term);
                      errors++;
                    }
                  }
                }
              }
            }
          }
          if (errors > 0) { console.error(errors + ' validation errors found'); process.exit(1); }
          console.log('All ' + index.length + ' data files validated successfully');
          "
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
